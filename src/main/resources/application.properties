# ===================================================================
# Server & Environment Configuration
# ===================================================================
server.port=8282
spring.profiles.active=development
CLIENT_HEADER_PREFIX=sakila2

# ===================================================================
# Database Connection (JDBC)
# Used directly by your HibernateConf.java class
# ===================================================================
jdbc.driverClassName=com.mysql.cj.jdbc.Driver
jdbc.url=jdbc:mysql://localhost:3306/sakila
jdbc.user=root
jdbc.pass=root

# ===================================================================
# Hibernate & JPA Custom Properties
# ===================================================================
hibernate.dialect=org.hibernate.dialect.MySQL5Dialect
hibernate.show_sql=true
hibernate.hbm2ddl.auto=validate
hibernate.transaction.auto_close_session=false
entitymanager.packagesToScan=com.sakila.modal

# ===================================================================
# Hibernate Second-Level Caching
# ===================================================================
hibernate.cache.use_second_level_cache=true
hibernate.cache.use_query_cache=true
hibernate.cache.region.factory_class=org.hibernate.cache.ehcache.EhCacheRegionFactory

# ===================================================================
# Logging Configuration (Log4j)
# ===================================================================
log4j.rootLogger=INFO, debug, RollingAppender

# Daily Rolling File Appender Settings
log4j.appender.RollingAppender=org.apache.log4j.DailyRollingFileAppender
log4j.appender.RollingAppender.File=C:\\HK\\sakila.log 
log4j.appender.RollingAppender.DatePattern='.'yyyy-MM-dd
log4j.appender.RollingAppender.layout=org.apache.log4j.PatternLayout
log4j.appender.RollingAppender.layout.ConversionPattern=[%p] %d %c %M - %m%n

# Size-based Backup File Appender Settings
log4j.appender.FILE=org.apache.log4j.RollingFileAppender
log4j.appender.FILE.File=C:\\HK\\sakila.log
log4j.appender.FILE.ImmediateFlush=true
log4j.appender.FILE.Threshold=debug
log4j.appender.FILE.Append=true
log4j.appender.FILE.MaxFileSize=5KB
log4j.appender.FILE.MaxBackupIndex=2
log4j.appender.FILE.layout=org.apache.log4j.PatternLayout
log4j.appender.FILE.layout.conversionPattern=%m%n


## Restructed using Google Gemini AI
# Local Development
app.security.allowed-origins=http://localhost:4200

# When deploying to Azure, change this variable in your Azure App Service Config to your production domain:
# app.security.allowed-origins=https://azurewebsites.net

server.forward-headers-strategy=framework


