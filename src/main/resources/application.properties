# ===================================================================
# Server & Environment Configuration
# ===================================================================
server.port=8282
spring.profiles.active=development
CLIENT_HEADER_PREFIX=sakila2

# Secure Cloud Setup: Handle Azure proxy routing headers safely
server.forward-headers-strategy=framework

# CORS Configuration
app.security.allowed-origins=http://localhost:4200

# ===================================================================
# Database Connection (JDBC)
# Fixed (CWE-522): Safe injection pattern using environment variables.
# Fallback defaults to 'root' locally if environment variables aren't set.
# ===================================================================
jdbc.driverClassName=com.mysql.cj.jdbc.Driver
jdbc.url=${DB_URL:jdbc:mysql://localhost:3306/sakila}
jdbc.user=${DB_USER:root}
jdbc.pass=${DB_PASSWORD:root}

# ===================================================================
# Hibernate & JPA Custom Properties
# ===================================================================
# Fixed: Upgraded legacy dialect to modern MySQL 8 standards
hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
hibernate.show_sql=true
hibernate.hbm2ddl.auto=validate
hibernate.transaction.auto_close_session=false
entitymanager.packagesToScan=com.sakila.modal

# ===================================================================
# Hibernate Second-Level Caching
# ===================================================================
hibernate.cache.use_second_level_cache=true
hibernate.cache.use_query_cache=true
hibernate.cache.region.factory_class=org.hibernate.cache.ehcache.EhCacheRegionFactory

# ===================================================================
# Modern Logging Configuration (SLF4J / Logback)
# Fixed (CWE-1104): Removed all obsolete Log4j configurations.
# ===================================================================
# Tells Spring where to look for your customized configuration file
logging.config=classpath:logback.xml

# Dynamic Log Direction Variable used inside your logback.xml file
# Locally: Writes inside C:/HK/logs/sakila-api.log
# On Azure: Simply override this key in App Service Settings to a cloud path
LOG_DIR=D:/HK/sakila
